<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduMe Mobile Preview</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #e2e8f0; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #e0f2fe, #f8fafc 55%, #ccfbf1); }
    .preview-shell { display: grid; gap: 12px; justify-items: center; }
    .preview-label { color: #334155; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .phone { width: 390px; height: 844px; overflow: hidden; border: 10px solid #0f172a; border-radius: 32px; background: #fff; box-shadow: 0 24px 60px rgba(15,23,42,.28); }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    @media (max-width: 440px) { body { display: block; padding: 0; }.preview-label { display: none; }.phone { width: 100vw; height: 100vh; border: 0; border-radius: 0; } }
  </style>
</head>
<body>
  <main class="preview-shell">
    <div class="preview-label">EduMe mobile preview · 390 × 844</div>
    <div class="phone"><iframe src="/" title="EduMe mobile preview"></iframe></div>
  </main>
</body>
</html>
