    <style>
      #boot-screen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        place-items: center;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        padding: 24px;
        background: linear-gradient(180deg, #dfe8f2 0%, #d5e0ec 100%);
        color: #1f2937;
        font: 800 1.15rem/1.2 Inter, "Segoe UI", sans-serif;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.18s ease;
      }
      #boot-screen.boot-screen-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-content {
        display: grid;
        justify-items: center;
        gap: 12px;
        width: min(100%, 220px);
        text-align: center;
        animation: boot-content-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot-screen img {
        display: block;
        width: clamp(72px, 18vw, 96px);
        height: clamp(72px, 18vw, 96px);
        object-fit: contain;
        border-radius: 20px;
      }
      #boot-screen span {
        display: block;
        color: #172033;
        font-size: clamp(1.2rem, 4vw, 1.45rem);
        font-weight: 800;
        letter-spacing: 0.01em;
        line-height: 1;
      }
      @keyframes boot-content-in {
        from { opacity: 0; transform: scale(0.94); }
        65% { opacity: 1; transform: scale(1.015); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-content { animation: none; }
      }
    </style>
    <title>EduMe – Student Study Planner | Shiv Bibhuti Mishra | SBM</title>
  </head>

        <span>EduMe</span>
